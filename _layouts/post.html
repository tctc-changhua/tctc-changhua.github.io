---
layout: default
---
<article class="container page post">
  <nav class="crumbs"><a href="{{ '/news/' | relative_url }}">最新消息</a></nav>
  <header class="page-header">
    <div class="meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y 年 %-m 月 %-d 日' }}</time>{% if page.pinned %}<span class="chip chip-red">置頂</span>{% endif %}</div>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">{{ content }}</div>
  {% if page.attachment and page.attachment != "" %}
  <p class="attachment"><a class="btn" href="{{ page.attachment | relative_url }}" target="_blank" rel="noopener">📎 下載附件</a></p>
  {% endif %}
</article>
